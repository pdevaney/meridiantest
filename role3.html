<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Your Roles</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 30px; margin: 0;">

  <form style="max-width: 480px; margin: auto; background: #ffffff; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">

    <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Your Job Roles</h2>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 6px; font-weight: bold; color: #333;">
        Current Roles
      </label>
      <div style="padding: 10px; background-color: #eef3f8; border: 1px solid #ccc; border-radius: 4px; color: #333; line-height: 1.5;">
        Lineworker / Field Technician<br>
        Health &amp; Safety Officer
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 10px; font-weight: bold; color: #333;">
        Select All Roles That Apply
      </label>

      <div style="border: 1px solid #ccc; border-radius: 4px; padding: 12px; background-color: #fafafa;">

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="lineworker" checked style="margin-right: 8px;">
          Lineworker / Field Technician
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="substation_technician" style="margin-right: 8px;">
          Substation Technician
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="metering_technician" style="margin-right: 8px;">
          Metering Technician
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="operations_controller" style="margin-right: 8px;">
          Operations Controller / Dispatcher
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="maintenance_planner" style="margin-right: 8px;">
          Maintenance Planner
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="asset_manager" style="margin-right: 8px;">
          Asset Manager
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="project_manager" style="margin-right: 8px;">
          Project Manager
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="engineering_manager" style="margin-right: 8px;">
          Engineering Manager
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="customer_service_rep" style="margin-right: 8px;">
          Customer Service Representative
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="billing_specialist" style="margin-right: 8px;">
          Billing / Revenue Specialist
        </label>

        <label style="display: block; margin-bottom: 8px; color: #333;">
          <input type="checkbox" name="roles[]" value="health_safety_officer" checked style="margin-right: 8px;">
          Health &amp; Safety Officer
        </label>

        <label style="display: block; color: #333;">
          <input type="checkbox" name="roles[]" value="it_systems_admin" style="margin-right: 8px;">
          IT / Systems Administrator
        </label>

      </div>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #005eb8; color: #fff; border: none; border-radius: 4px; font-size: 16px;">
      Save Roles
    </button>

  </form>

</body>
</html>
