<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Focus Areas</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Arimo&display=swap');

    body {
      font-family: 'Arimo', Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 30px;
      color: #333;
    }

    .form-card {
      max-width: 720px;
      margin: auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      color: #333;
    }

    p {
      margin: 0 0 20px 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .focus-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px 18px;
      margin: 20px 0;
    }

    .focus-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    button {
      background-color: #CB370F;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.info {
      display: block;
      background: #eef4ff;
      border: 1px solid #b8d1ff;
    }

    .status.success {
      display: block;
      background: #edf8ed;
      border: 1px solid #b9dfb9;
    }

    .status.error {
      display: block;
      background: #fff0f0;
      border: 1px solid #e0b4b4;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Select Focus Areas</h2>
    <p>Please select one or more focus areas, then submit the form.</p>

    <form id="focusAreaForm">
      <div id="focusAreas" class="focus-list"></div>

      <button id="submitButton" type="submit" disabled>
        Submit
      </button>

      <div id="statusMessage" class="status"></div>
    </form>
  </div>

  <script>
    // ------------------------------------------------------------------
    // Configuration
    // ------------------------------------------------------------------

    const GET_FOCUS_AREAS_URL =
      "https://apim.workato.com/216271_meridianc/focus_areas-v1/get_focus_areas";

    // Replace with your actual endpoint if different
    const SUBMIT_FOCUS_AREAS_URL =
      "https://apim.workato.com/216271_meridianc/focus_areas-v1/apply_focus_areas";

    // Replace with your Workato API token
    const API_TOKEN = "5bba275bebe09e2d81f165c9eefbbce9c0cbe457631e12be9e38499f123231d4";

    // ------------------------------------------------------------------
    // DOM references
    // ------------------------------------------------------------------

    const form = document.getElementById("focusAreaForm");
    const focusAreasContainer = document.getElementById("focusAreas");
    const submitButton = document.getElementById("submitButton");
    const statusMessage = document.getElementById("statusMessage");

    // ------------------------------------------------------------------
    // Utility functions
    // ------------------------------------------------------------------

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status " + type;
    }

    function getIframeParams() {
      const params = new URLSearchParams(window.location.search);

      return {
        user_id: params.get("user_id") || "",
        username: params.get("username") || "",
        auth_code: params.get("auth_code") || "",
        hash: params.get("hash") || "",
        iframe_src: window.location.href
      };
    }

    function buildBasePayload() {
      return {
        form_type: "focus_areas",
        form_subtype: "select_focus_areas",
        iframe_params: getIframeParams()
      };
    }

    // ------------------------------------------------------------------
    // Load focus areas from Workato
    // ------------------------------------------------------------------

    async function loadFocusAreas() {
      showStatus("Loading focus areas...", "info");

      try {
        const response = await fetch(GET_FOCUS_AREAS_URL, {
          method: "POST",
          headers: {
            "api-token": API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(buildBasePayload())
        });

        const result = await response.json();
        const responseBody = result.response || result;

        if (!response.ok || responseBody.status !== 0) {
          throw new Error(
            responseBody.message || "Unable to load focus areas."
          );
        }

        renderFocusAreas(responseBody.focus_areas || []);

        showStatus(
          "Focus areas loaded. Please make your selection.",
          "success"
        );

      } catch (error) {
        showStatus(
          "Error loading focus areas: " + error.message,
          "error"
        );
      }
    }

    // ------------------------------------------------------------------
    // Render checkbox list
    // ------------------------------------------------------------------

    function renderFocusAreas(focusAreas) {
      focusAreasContainer.innerHTML = "";

      focusAreas
        .sort((a, b) => Number(a.number) - Number(b.number))
        .forEach(area => {
          const label = document.createElement("label");
          label.className = "focus-item";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "focus_area";
          checkbox.value = area.field_id;

          // Pre-check if the API returned checked: true
          checkbox.checked = area.checked === true;

          // Store values for submission
          checkbox.dataset.fieldId = area.field_id;
          checkbox.dataset.name = (area.name || "").trim();
          checkbox.dataset.number = area.number;

          label.appendChild(checkbox);
          label.appendChild(
            document.createTextNode((area.name || "").trim())
          );

          focusAreasContainer.appendChild(label);
        });

      submitButton.disabled = focusAreas.length === 0;
    }

    // ------------------------------------------------------------------
    // Submit selected focus areas
    // ------------------------------------------------------------------

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const selected = Array.from(
        document.querySelectorAll('input[name="focus_area"]:checked')
      ).map(checkbox => ({
        field_id: Number(checkbox.dataset.fieldId),
        name: checkbox.dataset.name,
        number: Number(checkbox.dataset.number)
      }));

      if (selected.length === 0) {
        showStatus(
          "Please select at least one focus area.",
          "error"
        );
        return;
      }

      const payload = {
        ...buildBasePayload(),
        selected_focus_areas: selected
      };

      submitButton.disabled = true;
      showStatus("Sending request...", "info");

      try {
        const response = await fetch(SUBMIT_FOCUS_AREAS_URL, {
          method: "POST",
          headers: {
            "api-token": API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const resultText = await response.text();

        if (!response.ok) {
          throw new Error(
            resultText || "The request could not be submitted."
          );
        }

        let resultBody = null;

        try {
          resultBody = JSON.parse(resultText);
        } catch (e) {
          resultBody = null;
        }

        const isSuccess =
          resultText.trim().toUpperCase() === "SUCCESS" ||
          (
            resultBody &&
            String(
              resultBody.Status ||
              resultBody.status ||
              ""
            ).toUpperCase() === "SUCCESS"
          );

        if (!isSuccess) {
          throw new Error(
            resultText || "The request could not be submitted."
          );
        }

        showStatus(
  resultBody && resultBody.Message
    ? resultBody.Message + ". You may change your selection and submit again if needed."
    : "Thank you. Your focus areas have been submitted successfully. You may change your selection and submit again if needed.",
  "success"
);

submitButton.disabled = false;

      } catch (error) {
        showStatus(
          "Error submitting request: " + error.message,
          "error"
        );

        // Allow the user to try again
        submitButton.disabled = false;
      }
    });

    // ------------------------------------------------------------------
    // Initialise
    // ------------------------------------------------------------------

    loadFocusAreas();
  </script>

</body>
</html>
